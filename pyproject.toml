[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sars"
dynamic = ["version"]
description = "Species-area relationship curve fitting in Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John McMeen" }]
requires-python = ">=3.11"
keywords = ["species-area relationship", "SAR", "macroecology",
            "biodiversity", "ecology", "biogeography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.9.2",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.scripts]
sars = "sars.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-xdist",
    "filelock>=3",
    "ruff>=0.17,<0.18",
    "mypy",
    "pandas-stubs",
    "sars[geo]",
    "sars[server]",
    "httpx>=0.27",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]
docs = [
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]",
]
geo = ["geopandas>=0.12", "shapely>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
# An NVIDIA GPU for the start-grid screen (sars.set_backend("cupy")): CuPy for
# CUDA 13, with its CUDA libraries. For CUDA 12, install cupy-cuda12x instead.
gpu = ["cupy-cuda13x[ctk]>=14.0"]
# The Bayesian hierarchical log-log model (lin_pow_bayes): PyMC, with ArviZ.
bayes = ["pymc>=5.10"]
all = ["sars[geo]", "sars[server]"]

[project.urls]
Homepage = "https://github.com/jmcmeen/sars"
Documentation = "https://jmcmeen.github.io/sars/"
Repository = "https://github.com/jmcmeen/sars"
Issues = "https://github.com/jmcmeen/sars/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sars"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["sars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n logical, not auto: auto counts physical cores, 2 on CI's 4-vCPU runners.
addopts = "-n logical --cov=sars --cov-report=term-missing"
markers = [
    "notebook: runs an example notebook end to end (CI runs these in a job of their own)",
    "slow: fits many published datasets (CI runs these in a job of their own)",
]
filterwarnings = [
    # Starlette's test client (tests/test_server.py) warns that it will move from httpx to
    # a successor; the server itself uses neither.
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::scipy.optimize.OptimizeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:divide by zero:RuntimeWarning",
]

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No type information published for these.
module = ["scipy.*", "geopandas.*", "shapely.*", "matplotlib.*", "cupy", "cupy.*", "pymc", "pymc.*", "arviz", "arviz.*"]
ignore_missing_imports = true
