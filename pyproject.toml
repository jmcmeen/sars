[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sars"
dynamic = ["version"]
description = "Species-area relationship curve fitting in Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John McMeen" }]
requires-python = ">=3.10"
keywords = ["species-area relationship", "SAR", "macroecology",
            "biodiversity", "ecology", "biogeography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "pytest-xdist", "ruff>=0.17,<0.18", "mypy", "sars[geo]"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
interactive = ["plotly>=5"]
geo = ["geopandas>=0.12", "shapely>=2.0"]
all = ["sars[interactive,geo]"]

[project.urls]
Homepage = "https://github.com/jmcmeen/sars"
Documentation = "https://jmcmeen.github.io/sars/"
Repository = "https://github.com/jmcmeen/sars"
Issues = "https://github.com/jmcmeen/sars/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sars"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["sars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=sars --cov-report=term-missing"
filterwarnings = [
    "ignore::scipy.optimize.OptimizeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:divide by zero:RuntimeWarning",
]
