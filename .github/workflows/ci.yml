name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its older run. Every other run gets its own group,
  # so each push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Ruff only, no project install, at the exact version in uv.lock so CI
      # and local `uv sync` lint with the same release.
      - name: Resolve locked ruff version
        run: |
          version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)
          test -n "$version" || { echo "ruff not found in uv.lock" >&2; exit 1; }
          echo "RUFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: uvx "ruff@$RUFF_VERSION" check src tests

      - name: Format check
        run: uvx "ruff@$RUFF_VERSION" format --check src tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # The locked mypy and stubs, so CI and `make typecheck` agree.
      - name: mypy
        run: uv run --frozen --extra dev mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Coverage's sys.monitoring core is much faster than its C tracer on 3.12+;
      # older Pythons don't have sys.monitoring, and coverage warns if asked.
      # One math-library thread per test worker: xdist already runs a worker per
      # vCPU, and each BLAS pool sized to the whole runner would oversubscribe it.
      # --durations lists the slowest tests, to see where the time goes.
      - name: pytest
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          if python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then
            export COVERAGE_CORE=sysmon
          fi
          pytest --durations=15
