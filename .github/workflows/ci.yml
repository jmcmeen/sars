name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its older run. Every other run gets its own group,
  # so each push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Ruff only, no project install, at the exact version in uv.lock so CI
      # and local `uv sync` lint with the same release.
      - name: Resolve locked ruff version
        run: |
          version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)
          test -n "$version" || { echo "ruff not found in uv.lock" >&2; exit 1; }
          echo "RUFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: uvx "ruff@$RUFF_VERSION" check src tests docs/examples

      - name: Format check
        run: uvx "ruff@$RUFF_VERSION" format --check src tests docs/examples

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # The locked mypy and stubs, so CI and `make typecheck` agree.
      - name: mypy
        run: uv run --frozen --extra dev mypy

  test:
    runs-on: ubuntu-latest
    # 3.15 is a pre-release: a failure there is reported but doesn't fail the run,
    # so a pre-release regression can't block a merge or a release.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest stable Pythons; pushes to main
        # (which release) and manual runs (the top of a PR stack) test them all.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # One math-library thread per test worker: xdist already runs a worker per
      # vCPU, and each BLAS pool sized to the whole runner would oversubscribe it.
      # --durations lists the slowest tests, to see where the time goes.
      # The notebooks and the 34-dataset fits (slow) run once, in the notebooks job.
      # Coverage (only printed) runs
      # on 3.14, which every run tests, with coverage's sys.monitoring core, much
      # faster than its C tracer.
      - name: pytest
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          cov=--no-cov
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            cov=
            export COVERAGE_CORE=sysmon
          fi
          pytest -m "not notebook and not slow" $cov --durations=15

  notebooks:
    name: notebooks and datasets
    # The example notebooks, end to end, and the fits to 34 published datasets,
    # once: they test the examples and the fitting on varied data, not
    # compatibility with each Python, and are the slowest tests by far.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -m "notebook or slow" --no-cov --durations=5
