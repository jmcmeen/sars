name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Ruff only, no project install, at the exact version in uv.lock so CI
      # and local `uv sync` lint with the same release.
      - name: Resolve locked ruff version
        run: |
          version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)
          test -n "$version" || { echo "ruff not found in uv.lock" >&2; exit 1; }
          echo "RUFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: uvx "ruff@$RUFF_VERSION" check src tests

      - name: Format check
        run: uvx "ruff@$RUFF_VERSION" format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install -e ".[dev]"
      - run: pytest
