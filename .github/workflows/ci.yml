name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Ruff only, no project install: same version range as [dev] in pyproject.
      - name: Lint
        run: uvx --from 'ruff>=0.17,<0.18' ruff check src tests

      - name: Format check
        run: uvx --from 'ruff>=0.17,<0.18' ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install -e ".[dev]"
      - run: pytest
