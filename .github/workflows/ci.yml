name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, for the newest and minimum dependency versions (see those jobs); only
  # a push to main triggers a release.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  # A new push to a PR cancels its older run. Every other run gets its own group,
  # so each push to main finishes CI and can be released.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Ruff only, no project install, at the exact version in uv.lock so CI
      # and local `uv sync` lint with the same release.
      - name: Resolve locked ruff version
        run: |
          version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)
          test -n "$version" || { echo "ruff not found in uv.lock" >&2; exit 1; }
          echo "RUFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: uvx "ruff@$RUFF_VERSION" check src tests docs/examples

      - name: Format check
        run: uvx "ruff@$RUFF_VERSION" format --check src tests docs/examples

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # The locked mypy and stubs, so CI and `make typecheck` agree.
      - name: mypy
        run: uv run --frozen --extra dev mypy

  test:
    runs-on: ubuntu-latest
    # 3.15 is a pre-release: a failure there is reported but doesn't fail the run,
    # so a pre-release regression can't block a merge or a release.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest stable Pythons; pushes to main
        # (which release) and manual runs (the top of a PR stack) test them all.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python-version }}"
          enable-cache: true
      # Exactly the versions in uv.lock, so a failure comes from the change under
      # test, not from a dependency's new release (the newest job catches those).
      - run: uv sync --frozen --extra dev
      # One math-library thread per test worker (env above): xdist already runs a
      # worker per vCPU, and each BLAS pool sized to the whole runner would
      # oversubscribe it. --durations lists the slowest tests.
      # The notebooks and the 34-dataset fits (slow) run once, in jobs of their own.
      # Coverage (only printed) runs on 3.14, which every run tests, with coverage's
      # sys.monitoring core, much faster than its C tracer.
      - name: pytest
        run: |
          cov=--no-cov
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            cov=
            export COVERAGE_CORE=sysmon
          fi
          uv run --frozen --no-sync pytest -m "not notebook and not slow" $cov --durations=15

  notebooks:
    name: notebooks
    # The example notebooks, end to end, once: they test the examples, not
    # compatibility with each Python.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run --frozen --no-sync pytest -m notebook --no-cov --durations=5

  datasets:
    name: datasets
    # The fits to 34 published datasets, once: they test the fitting on varied
    # data, not compatibility with each Python, and are slow. Run beside the
    # notebooks, so a failure says which of the two broke.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run --frozen --no-sync pytest -m slow --no-cov --durations=5

  bayes:
    name: bayes extra
    # lin_pow_bayes with PyMC (the bayes extra), once: sampling is slow and the
    # extra is heavy, so the other jobs don't install it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra bayes
      - name: pytest
        run: uv run --frozen --no-sync pytest tests/test_bayes.py -m "bayes or not bayes" --no-cov --durations=5

  minimums:
    name: minimum dependencies
    # The oldest numpy, scipy, pandas and matplotlib pyproject.toml allows (its
    # runtime dependencies; not the geo extra's), on the
    # oldest Python: what sars promises to work with. Not on pull requests (the
    # floors rarely move); on pushes to main it gates the release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      # Each runtime dependency's floor (">=") pinned exactly; the dev tools and the
      # geo extra resolve around them. matplotlib 3.6 calls pyparsing's camelCase
      # API, deprecated in pyparsing 3 and due to go in 4, so pyparsing is capped:
      # raise the matplotlib floor rather than the cap when that bites.
      - name: Install the minimums
        run: |
          uv run --no-project --with packaging python - <<'PY' > minimums.txt
          import tomllib
          from packaging.requirements import Requirement
          for dep in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]:
              req = Requirement(dep)
              floors = [s.version for s in req.specifier if s.operator == ">="]
              if not floors:
                  raise SystemExit(f"{dep}: no >= floor to test")
              print(f"{req.name}=={floors[0]}")
          print("pyparsing<4")
          PY
          cat minimums.txt
          uv venv
          uv pip install --constraint minimums.txt -e ".[dev]"
      - name: pytest
        run: uv run --no-sync pytest -m "not notebook and not slow" --no-cov

  newest:
    name: newest dependencies
    # The newest releases, ignoring uv.lock, to catch an upstream release that
    # breaks sars before users do. Informational: a failure shows in the job list
    # but doesn't fail the run or block a release.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the hatch-vcs version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --upgrade --extra dev
      - name: pytest
        run: uv run --no-sync pytest -m "not notebook and not slow" --no-cov
