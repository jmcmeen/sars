name: Paper draft
on:
  push:
    paths: ["paper/**"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

jobs:
  paper:
    name: Build JOSS draft PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        # master as of 2026-09-23; bump deliberately
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
