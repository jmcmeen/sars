site_name: sars
site_description: Species-area relationship curve fitting in Python
site_url: https://jmcmeen.github.io/sars/
repo_url: https://github.com/jmcmeen/sars
repo_name: jmcmeen/sars

theme:
  name: material
  # Light or dark to match the reader's system setting, with a toggle in the header.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - tables

plugins:
  - search
  - mkdocs-jupyter:
      # Notebooks are committed executed; the build renders their stored outputs.
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Models: models.md
  - Datasets: datasets.md
  - Validation: validation.md
  - Command Line: cli.md
  - HTTP Server: server.md
  - Examples:
      - Galápagos plants: examples/galapagos.ipynb
      - Appalachian amphibians: examples/appalachian.ipynb
      - Areas from polygons: examples/geodataframe.ipynb
      - Galápagos islands from polygons: examples/galapagos_polygons.ipynb
  - API Reference:
      - Models: api/models.md
      - Multi-model Inference: api/inference.md
      - Threshold Models: api/threshold.md
      - Habitat Models: api/habitat.md
      - Sampling Effort: api/effort.md
      - Random Placement: api/coleman.md
      - General Dynamic Model: api/gdm.md
      - Plotting: api/plots.md
      - I/O Adapters: api/io.md
      - Backend: api/backend.md
