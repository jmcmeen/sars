site_name: sars
site_description: Species-area relationship curve fitting in Python
site_url: https://jmcmeen.github.io/sars/
repo_url: https://github.com/jmcmeen/sars
repo_name: jmcmeen/sars

theme:
  name: material
  palette:
    scheme: slate
  font: false
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - tables

plugins:
  - search
  - mkdocs-jupyter:
      # Notebooks are committed executed; the build renders their stored outputs.
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Models: models.md
  - Examples:
      - Galápagos plants: examples/galapagos.ipynb
  - API Reference:
      - Models: api/models.md
      - Multi-model Inference: api/inference.md
      - Threshold Models: api/threshold.md
      - Plotting: api/plots.md
      - I/O Adapters: api/io.md
